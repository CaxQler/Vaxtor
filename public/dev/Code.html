<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VAXTOR — DEV PANEL</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="/img/vaxtor-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    .dev-shell { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
    .dev-side { border-right: 1px solid var(--line); background: rgba(12,7,22,.8); padding: 22px 14px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 5px; }
    .dev-main { padding: 30px clamp(18px,3vw,44px) 80px; min-width: 0; }
    .dev-brand { font-weight: 900; letter-spacing: .22em; font-size: 13px; color: #f0abfc; padding: 6px 12px 18px; }
    .folder-item { display:flex; align-items:center; gap:10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 14px; border: 1px solid transparent; }
    .folder-item:hover { background: var(--panel-2); color: var(--text); }
    .folder-item.active { background: rgba(192,38,211,.14); border-color: rgba(192,38,211,.4); color: #fff; }
    .key-card { display:flex; align-items:center; gap:14px; padding: 13px 16px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel); }
    .key-card .k { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: .1em; }
    .circ { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
    .circ.live { background: var(--green); box-shadow: 0 0 12px var(--green); }
    .circ.unlive { background: var(--red); box-shadow: 0 0 12px var(--red); }
    .lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; }
    .lbl.live { color: #86efac; } .lbl.unlive { color: #fca5a5; }
    .user-file { display:flex; align-items:center; gap:12px; padding: 12px 15px; border-radius: 11px; border:1px solid var(--line); background: var(--panel); cursor: pointer; transition: .15s; }
    .user-file:hover { border-color: var(--line-2); transform: translateX(3px); }
    .kbd { font-family: var(--mono); background: rgba(139,92,246,.14); border:1px solid rgba(139,92,246,.35); padding: 2px 9px; border-radius: 7px; font-size: 12px; }
    .audit-line { font-size: 12.6px; color: var(--muted); padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.045); font-family: var(--mono); }
    @media (max-width: 900px) { .dev-shell { grid-template-columns: 1fr; } .dev-side { position: static; height: auto; } }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow b"></div>

  <!-- LOGIN GATE -->
  <div class="auth-wrap" id="devLogin">
    <div class="auth-card">
      <div class="logo"><img class="logo-mark" src="/img/vaxtor-logo.png" alt="" /> VAXTOR DEV</div>
      <h1>Bytelater panel.</h1>
      <div class="sub">Summon keys, manage users, watch the platform. Private — dev only.</div>
      <div class="auth-err" id="devErr"></div>
      <div class="field">
        <label>Dev password</label>
        <input class="input" id="devPass" type="password" placeholder="••••••••" />
      </div>
      <button class="btn primary block" id="btnDevLogin">Enter panel →</button>
      <div class="tiny" style="margin-top:18px; text-align:center">default password: <span class="kbd">bytelater</span> — change it in Settings</div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="dev-shell" id="devPanel" style="display:none">
    <aside class="dev-side">
      <div class="dev-brand"><span data-ico="zap" data-ico-size="13"></span> VAXTOR // DEV</div>
      <div class="folder-item active" data-page="dash"><span class="ico" data-ico="grid" data-ico-size="15"></span>Dashboard</div>
      <div class="folder-item" data-page="keys"><span class="ico" data-ico="key" data-ico-size="15"></span>Keys</div>
      <div class="folder-item" data-page="userset"><span class="ico" data-ico="users" data-ico-size="15"></span>Users-set</div>
      <div class="folder-item" data-page="audit"><span class="ico" data-ico="clock" data-ico-size="15"></span>Audit log</div>
      <div class="folder-item" data-page="settings"><span class="ico" data-ico="sliders" data-ico-size="15"></span>Settings</div>
      <div style="margin-top:auto">
        <div class="folder-item" id="btnDevLogout"><span class="ico" data-ico="power" data-ico-size="15"></span>Sign out</div>
      </div>
    </aside>

    <main class="dev-main">
      <div id="devView"></div>
    </main>
  </div>

  <!-- MODAL: user profile (User.html equivalent) -->
  <div class="modal-bg" id="modalUser">
    <div class="modal" style="max-width:560px">
      <div id="userDetail"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="../js/icons.js"></script>
  <script src="../js/snow.js"></script>
  <script src="../js/toast.js"></script>
  <script src="dev.js"></script>
</body>
</html>
