<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Vaxtor</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="/img/vaxtor-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow a"></div>
  <div class="bg-glow b"></div>

  <nav class="nav">
    <a class="logo" href="/"><img class="logo-mark" src="/img/vaxtor-logo.png" alt="" /> Vaxtor</a>
    <div class="row"><a class="btn sm ghost" href="/">← Back to home</a></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo"><img class="logo-mark" src="/img/vaxtor-logo.png" alt="" /> Vaxtor</div>
      <h1 id="authTitle">Welcome back.</h1>
      <div class="sub" id="authSub">Sign in to manage your bots and keep them online 24/7.</div>

      <div class="auth-tabs">
        <button id="tabSignin" class="active">Sign in</button>
        <button id="tabSignup">Create account</button>
      </div>

      <div class="auth-err" id="authErr"></div>

      <!-- SIGN IN -->
      <form id="formSignin">
        <div class="field">
          <label>Name or Email</label>
          <input class="input" id="loginId" placeholder="e.g. ggh or ggh@bytelater.dev" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn primary block" type="submit" id="btnSignin">Sign in →</button>
      </form>

      <!-- SIGN UP -->
      <form id="formSignup" style="display:none">
        <div class="field">
          <label>Name</label>
          <input class="input" id="regName" placeholder="e.g. ggh" autocomplete="username" />
        </div>
        <div class="field">
          <label>Email</label>
          <input class="input" id="regEmail" type="email" placeholder="you@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label>Password</label>
          <input class="input" id="regPass" type="password" placeholder="min. 6 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input class="input" id="regPass2" type="password" placeholder="repeat password" autocomplete="new-password" />
        </div>
        <button class="btn primary block" type="submit" id="btnSignup">Create account →</button>
      </form>

      <div class="divider">or</div>
      <button class="btn block" id="btnDiscord" style="background:rgba(88,101,242,.18);border-color:rgba(88,101,242,.6);color:#c7d2fe">
        <img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord" width="20" height="20" />
        Continue with Discord
      </button>

      <div style="text-align:center; margin-top:22px; font-size:13px; color:var(--muted-2)">
        <span id="authFootLead">New to Vaxtor?</span> <a href="#" id="linkAuthToggle" data-target="signup" style="color:#c4b5fd">Create an account</a> · <a href="/" style="color:#c4b5fd">Home</a>
      </div>
    </div>
  </div>

  <div id="toasts"></div>
  <script src="js/icons.js"></script>
  <script src="js/snow.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
